<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#006c3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LINE Analytics">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap">
  <title>売上分析</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg0: #061320;
      --bg1: #173247;
      --card: rgba(8,21,35,0.84);
      --line: rgba(155,220,255,0.25);
      --txt: #e7f6ff;
      --sub: #a6cadf;
      --ok: #69edbf;
      --accent: #57d8ff;
      --warn: #ffd17e;
      --bad: #ff7c9f;
      --radius: 16px;
      --shadow: 0 20px 45px rgba(0,0,0,0.35);
      --c-gross: #59dcff;
      --c-net: #6cf0be;
      --c-tax: #ffd07d;
      --c-party: #9de6b6;
      --c-guest: #ff9fbf;
      --c-rain: #7ab4ff;
      --c-temp: #ffb347;
    }
    body[data-theme='light'] {
      --bg0: #f0f8ff; --bg1: #d8ecf8;
      --card: rgba(255,255,255,0.95); --line: rgba(45,106,151,0.22);
      --txt: #0f2436; --sub: #4a6d85; --ok: #0b7d52;
      --accent: #0f73b0; --warn: #a06b10; --bad: #c0405f;
      --shadow: 0 8px 28px rgba(15,50,80,0.12);
      background:
        radial-gradient(900px 500px at -20% -10%,#c8e8f8 0%,transparent 60%),
        radial-gradient(900px 500px at 120% 0%,#bcd8f0 0%,transparent 55%),
        linear-gradient(145deg,var(--bg0),var(--bg1)) !important;
    }
    body[data-theme='light'] .hero {
      background: linear-gradient(160deg,rgba(15,115,176,0.10),rgba(180,218,240,0.55));
      border-color: rgba(45,106,151,0.20);
    }
    body[data-theme='light'] .pill {
      background: rgba(255,255,255,0.80);
      border-color: rgba(45,106,151,0.28);
      color: var(--txt);
    }
    body[data-theme='light'] .pill.ok {
      background: rgba(11,125,82,0.08);
      color: var(--ok);
    }
    body[data-theme='light'] .pill.link {
      color: var(--accent);
      background: rgba(15,115,176,0.08);
      border-color: rgba(15,115,176,0.30);
    }
    body[data-theme='light'] button.pill[style*="border-color: var(--warn)"],
    body[data-theme='light'] button.pill.warn { border-color: var(--warn); color: var(--warn); }
    body[data-theme='light'] .input,
    body[data-theme='light'] .select {
      background: rgba(255,255,255,0.90);
      border-color: rgba(45,106,151,0.28);
      color: var(--txt);
    }
    body[data-theme='light'] .btn {
      background: rgba(240,248,255,0.90);
      border-color: rgba(45,106,151,0.28);
      color: var(--txt);
    }
    body[data-theme='light'] .btn.primary {
      background: linear-gradient(180deg,rgba(15,115,176,0.18),rgba(15,115,176,0.10));
      border-color: rgba(15,115,176,0.40);
      color: var(--accent);
    }
    body[data-theme='light'] .btn.active {
      background: rgba(15,115,176,0.16);
      border-color: var(--accent);
      color: var(--accent);
    }
    body[data-theme='light'] .chart-tab {
      background: rgba(255,255,255,0.75);
      border-color: rgba(45,106,151,0.24);
      color: var(--sub);
    }
    body[data-theme='light'] .chart-tab.active {
      background: rgba(15,115,176,0.14);
      border-color: var(--accent);
      color: var(--accent);
    }
    body[data-theme='light'] .loading-overlay {
      background: rgba(230,243,253,0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      color: var(--txt);
      font-family: "Zen Kaku Gothic New", sans-serif;
      background:
        radial-gradient(900px 500px at -20% -10%,#215f84 0%,transparent 60%),
        radial-gradient(900px 500px at 120% 0%,#185273 0%,transparent 55%),
        linear-gradient(145deg,var(--bg0),var(--bg1));
      padding: 20px;
    }
    .app { max-width: 1360px; margin: 0 auto; display: grid; gap: 16px; }
    .hero, .card {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .hero {
      padding: 18px 20px;
      background: linear-gradient(160deg,rgba(87,216,255,0.15),rgba(8,21,35,0.65));
    }
    .hero h1 {
      font-family: "Barlow Condensed", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      font-size: clamp(2rem,3.2vw,2.8rem);
      line-height: 0.95;
    }
    .hero p { margin-top: 10px; color: var(--sub); }
    .status { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; color: var(--sub); font-size: 0.88rem; align-items: center; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      background: rgba(8,21,35,0.6);
      text-decoration: none;
      color: inherit;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button.pill { font: inherit; cursor: pointer; }
    .pill.ok { color: var(--ok); border-color: color-mix(in srgb,var(--ok) 55%,transparent); }
    .pill.link { color: #9be8ff; display: inline-flex; align-items: center; }
    .card { background: var(--card); padding: 16px; }
    .card-title { font-size: 1.08rem; padding-bottom: 8px; border-bottom: 1px solid rgba(155,220,255,0.18); margin-bottom: 14px; }
    .controls { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
    .input, .select, .btn {
      min-height: 38px; border-radius: 11px;
      border: 1px solid var(--line);
      background: rgba(8,21,35,0.6);
      color: var(--txt); padding: 0 12px; font: inherit;
    }
    .btn { cursor: pointer; font-weight: 700; }
    .btn.primary {
      border-color: color-mix(in srgb,var(--accent) 60%,transparent);
      background: linear-gradient(180deg,rgba(87,216,255,0.32),rgba(10,116,158,0.32));
    }
    .btn.active {
      background: linear-gradient(180deg,rgba(87,216,255,0.45),rgba(10,116,158,0.45));
      border-color: var(--accent);
      color: var(--accent);
    }
    .meta { margin-top: 8px; color: var(--sub); font-size: 0.87rem; }

    /* KPI cards */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 10px; }
    .kpi-card {
      border: 1px solid rgba(155,220,255,0.18);
      border-radius: 12px;
      background: rgba(5,17,28,0.5);
      padding: 12px 14px;
    }
    body[data-theme='light'] .kpi-card { background: rgba(230,243,253,0.6); }
    .kpi-label { font-size: 0.78rem; color: var(--sub); margin-bottom: 4px; }
    .kpi-value { font-family: "Barlow Condensed", sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    .kpi-sub { font-size: 0.78rem; color: var(--sub); margin-top: 2px; }
    .kpi-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; min-height: 1.4em; }
    .kpi-badge { font-size: 0.72rem; font-weight: 700; border-radius: 4px; padding: 1px 5px; }
    .kpi-badge.up { color: var(--ok); background: rgba(105,237,191,0.12); }
    .kpi-badge.down { color: var(--bad); background: rgba(255,124,159,0.12); }
    .kpi-badge.flat { color: var(--sub); }

    /* Chart layout */
    .charts-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .charts-row { grid-template-columns: 1fr; } }
    .chart-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); padding: 16px; box-shadow: var(--shadow); }
    .chart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .chart-title { font-size: 0.95rem; font-weight: 700; }
    .chart-wrap { position: relative; height: 260px; }
    .chart-wrap.tall { height: 320px; }
    .chart-wrap.short { height: 200px; }
    .chart-tab-group { display: flex; gap: 6px; }
    .chart-tab {
      font-size: 0.78rem; padding: 3px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: rgba(8,21,35,0.5);
      color: var(--sub); cursor: pointer; font: inherit;
    }
    .chart-tab.active { background: rgba(87,216,255,0.18); border-color: var(--accent); color: var(--accent); }

    /* weather badge */
    .weather-badge { font-size: 0.78rem; color: var(--sub); display: flex; gap: 8px; flex-wrap: wrap; }
    .weather-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

    /* loading / error */
    .loading-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(6,19,32,0.7); border-radius: 8px;
      align-items: center; justify-content: center;
      font-size: 0.9rem; color: var(--sub);
    }
    .loading-overlay.show { display: flex; }

    /* weekday labels */
    .weekday-note { font-size: 0.78rem; color: var(--sub); margin-top: 6px; }

    /* weather cross table */
    .cross-table { border-collapse: collapse; font-size: 0.82rem; min-width: 100%; }
    .cross-table th, .cross-table td { padding: 7px 10px; text-align: center; border: 1px solid var(--line); white-space: nowrap; }
    .cross-table thead th { color: var(--sub); font-weight: 600; background: rgba(155,220,255,0.06); }
    .cross-table tbody th { font-weight: 700; color: var(--txt); background: rgba(155,220,255,0.04); }
    .cross-table tfoot th, .cross-table tfoot td { color: var(--sub); font-weight: 700; background: rgba(155,220,255,0.06); }
    .cross-table td.hot { background: rgba(105,237,191,0.18); color: var(--ok); font-weight: 700; }
    .cross-table td.cold { background: rgba(255,124,159,0.12); color: var(--bad); }
    .cross-table td.empty { color: var(--sub); opacity: 0.5; }
    body[data-theme='light'] .cross-table thead th,
    body[data-theme='light'] .cross-table tfoot td { background: rgba(45,106,151,0.08); }
    body[data-theme='light'] .cross-table tbody th { background: rgba(45,106,151,0.04); }

    /* 日次売上（数値表）— 管理画面 index から移設。2/3/4 ブロックはビューポート連動 */
    .receipt-daily { padding: 14px 16px; }
    .receipt-daily .card-title { margin-bottom: 8px; }
    .receipt-daily-table-wrap {
      margin-top: 8px;
      max-height: min(48vh, 340px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(8,21,35,0.35);
    }
    body[data-theme='light'] .receipt-daily-table-wrap {
      background: rgba(230,243,253,0.55);
    }
    .receipt-daily #receiptDailyTable {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .receipt-daily #receiptDailyTable th,
    .receipt-daily #receiptDailyTable td {
      padding: 2px 5px;
      font-size: 0.7rem;
      line-height: 1.2;
      border-bottom: 1px solid var(--line);
    }
    .receipt-daily #receiptDailyTable th {
      position: sticky;
      top: 0;
      z-index: 1;
      font-size: 0.62rem;
      padding: 3px 5px;
      letter-spacing: 0.02em;
      color: var(--sub);
      text-transform: uppercase;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      box-shadow: 0 1px 0 var(--line);
    }
    body[data-theme='light'] .receipt-daily #receiptDailyTable th {
      background: color-mix(in srgb, var(--card) 95%, #fff);
    }
    .receipt-daily.receipt-daily--blocks-2 #receiptDailyTable { min-width: 26rem; }
    .receipt-daily.receipt-daily--blocks-3 #receiptDailyTable { min-width: 38rem; }
    .receipt-daily.receipt-daily--blocks-4 #receiptDailyTable { min-width: 50rem; }
    .receipt-daily #receiptDailyTable th:nth-child(4n+1),
    .receipt-daily #receiptDailyTable td:nth-child(4n+1) {
      width: 10%;
      white-space: nowrap;
    }
    .receipt-daily #receiptDailyTable th:nth-child(4n+2),
    .receipt-daily #receiptDailyTable td:nth-child(4n+2) { width: 15%; }
    .receipt-daily #receiptDailyTable th:nth-child(4n+3),
    .receipt-daily #receiptDailyTable td:nth-child(4n+3),
    .receipt-daily #receiptDailyTable th:nth-child(4n+4),
    .receipt-daily #receiptDailyTable td:nth-child(4n+4) { width: 10%; }
    .receipt-daily.receipt-daily--blocks-2 #receiptDailyTable th:nth-child(4),
    .receipt-daily.receipt-daily--blocks-2 #receiptDailyTable td:nth-child(4) {
      border-right: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }
    .receipt-daily.receipt-daily--blocks-3 #receiptDailyTable th:nth-child(4),
    .receipt-daily.receipt-daily--blocks-3 #receiptDailyTable td:nth-child(4),
    .receipt-daily.receipt-daily--blocks-3 #receiptDailyTable th:nth-child(8),
    .receipt-daily.receipt-daily--blocks-3 #receiptDailyTable td:nth-child(8) {
      border-right: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }
    .receipt-daily.receipt-daily--blocks-4 #receiptDailyTable th:nth-child(4),
    .receipt-daily.receipt-daily--blocks-4 #receiptDailyTable td:nth-child(4),
    .receipt-daily.receipt-daily--blocks-4 #receiptDailyTable th:nth-child(8),
    .receipt-daily.receipt-daily--blocks-4 #receiptDailyTable td:nth-child(8),
    .receipt-daily.receipt-daily--blocks-4 #receiptDailyTable th:nth-child(12),
    .receipt-daily.receipt-daily--blocks-4 #receiptDailyTable td:nth-child(12) {
      border-right: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
    }
    .receipt-daily #receiptDailyTable th:nth-child(n+2):not(:nth-child(4n+1)),
    .receipt-daily #receiptDailyTable td:nth-child(n+2):not(:nth-child(4n+1)) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .receipt-daily #receiptDailyTable td.empty {
      text-align: center;
      color: var(--sub);
      padding: 12px;
    }
    .receipt-daily--blocks-2 .receipt-daily-block0-empty td:nth-child(-n+4) { opacity: 0.48; }
    .receipt-daily--blocks-2 .receipt-daily-block1-empty td:nth-child(n+5) { opacity: 0.48; }
    .receipt-daily--blocks-3 .receipt-daily-block0-empty td:nth-child(-n+4) { opacity: 0.48; }
    .receipt-daily--blocks-3 .receipt-daily-block1-empty td:nth-child(n+5):nth-child(-n+8) { opacity: 0.48; }
    .receipt-daily--blocks-3 .receipt-daily-block2-empty td:nth-child(n+9) { opacity: 0.48; }
    .receipt-daily--blocks-4 .receipt-daily-block0-empty td:nth-child(-n+4) { opacity: 0.48; }
    .receipt-daily--blocks-4 .receipt-daily-block1-empty td:nth-child(n+5):nth-child(-n+8) { opacity: 0.48; }
    .receipt-daily--blocks-4 .receipt-daily-block2-empty td:nth-child(n+9):nth-child(-n+12) { opacity: 0.48; }
    .receipt-daily--blocks-4 .receipt-daily-block3-empty td:nth-child(n+13) { opacity: 0.48; }

    /* canvas overflow 防止 / grid item min-width reset */
    html { overflow-x: hidden; }
    .chart-wrap canvas { max-width: 100% !important; display: block; }
    .chart-card { overflow: hidden; min-width: 0; }
    .chart-wrap { overflow: hidden; min-width: 0; width: 100%; }
    .charts-grid, .charts-row { min-width: 0; }
    .app { min-width: 0; }
    /* grid items must not expand beyond their track */
    .app > * { min-width: 0; }
    .hero, .card { min-width: 0; overflow: hidden; }

    /* ── mobile ── */
    @media (max-width: 600px) {
      body { padding: 10px; overflow-x: hidden; }
      .app { gap: 10px; }

      /* hero */
      .hero { padding: 14px; }
      .hero h1 { font-size: 1.7rem; }
      .hero p { display: none; }
      .status { gap: 6px; font-size: 0.8rem; }
      .pill { padding: 3px 8px; }
      /* ナビリンクをスクロール可能な1行に */
      .status { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .status::-webkit-scrollbar { display: none; }

      /* cards */
      .card { padding: 12px; }
      .card-title { font-size: 0.97rem; margin-bottom: 10px; }

      /* 接続カード：トークン保存済みなら折りたたみ */
      .auth-saved .auth-url-row { display: none; }
      .auth-saved .auth-full-row { display: none; }
      .auth-compact { display: flex !important; }

      /* 接続フォームをフル幅縦並びに */
      .controls { flex-direction: column; align-items: stretch; }
      .controls .input, .controls .select, .controls .btn { width: 100%; min-width: 0; }
      /* 接続ボタン行だけ横並び */
      .btn-row { flex-direction: row !important; }
      .btn-row .btn { flex: 1; }

      /* 絞り込み：店舗select フル幅、タブはスクロール */
      #storeSelect { width: 100%; }
      #periodTabs {
        overflow-x: auto; -webkit-overflow-scrolling: touch;
        flex-wrap: nowrap; width: 100%;
        padding-bottom: 4px;
      }
      #periodTabs::-webkit-scrollbar { display: none; }
      .chart-tab { white-space: nowrap; padding: 5px 12px; font-size: 0.82rem; }
      #reloadBtn { width: 100%; }

      /* KPI: 2列固定 */
      .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .kpi-card { padding: 10px 10px; }
      .kpi-value { font-size: 1.3rem; }
      .kpi-label { font-size: 0.72rem; }

      /* charts */
      .chart-card { padding: 12px; }
      .chart-wrap { height: 220px; }
      .chart-wrap.tall { height: 250px; }
      .chart-head { margin-bottom: 8px; }
      .chart-title { font-size: 0.88rem; }
      /* 天候バッジをコンパクト化 */
      .weather-badge { font-size: 0.72rem; gap: 6px; }
      #weatherStatus { display: none; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header class="hero">
    <h1>売上分析</h1>
    <p>レシートデータの多角的な分析ダッシュボード</p>
    <div class="status">
      <span id="authState" class="pill">未接続</span>
      <span id="lastRefresh" class="pill">最終更新: なし</span>
      <a href="./index.html" class="pill link" id="adminLink">管理画面</a>
      <button id="themeBtn" type="button" class="pill">ライトモード</button>
    </div>
  </header>

  <!-- Auth -->
  <section class="card" id="authCard">
    <h2 class="card-title">接続</h2>
    <div class="controls">
      <input id="projectUrlInput" class="input" type="text" readonly tabindex="-1">
      <input id="tokenInput" class="input" type="password" placeholder="ADMIN_DASHBOARD_TOKEN">
      <div class="controls btn-row">
        <button id="saveTokenBtn" class="btn primary">保存して接続</button>
        <button id="clearTokenBtn" class="btn">削除</button>
      </div>
    </div>
  </section>

  <!-- Filters -->
  <section class="card">
    <h2 class="card-title">絞り込み</h2>
    <div class="controls">
      <select id="storeSelect" class="select" aria-label="店舗選択">
        <option value="">（店舗を選択）</option>
      </select>
      <input id="monthPicker" class="input" type="month" aria-label="対象月">
      <div class="chart-tab-group" id="periodTabs">
        <button class="chart-tab active" data-period="month">今月</button>
        <button class="chart-tab" data-period="prev">先月</button>
        <button class="chart-tab" data-period="3m">3ヶ月</button>
        <button class="chart-tab" data-period="6m">6ヶ月</button>
        <button class="chart-tab" data-period="12m">12ヶ月</button>
      </div>
      <button id="reloadBtn" class="btn primary">再読み込み</button>
    </div>
    <div id="filterMeta" class="meta">未取得</div>
  </section>

  <!-- KPI -->
  <section class="card">
    <h2 class="card-title">月間サマリー <span id="kpiPeriodLabel" style="font-size:0.85rem;color:var(--sub);font-weight:400"></span></h2>
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card"><div class="kpi-label">月間総売上</div><div class="kpi-value" id="kpiGross">-</div><div class="kpi-badges"><span class="kpi-badge flat" id="kpiBadgeGrossMom"></span><span class="kpi-badge flat" id="kpiBadgeGrossYoy"></span></div></div>

      <div class="kpi-card"><div class="kpi-label">月間会計組数</div><div class="kpi-value" id="kpiParty">-</div><div class="kpi-sub" id="kpiPartyAvg"></div><div class="kpi-badges"><span class="kpi-badge flat" id="kpiBadgePartyMom"></span><span class="kpi-badge flat" id="kpiBadgePartyYoy"></span></div></div>

/* ── helpers ── */
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
function removeToken() { localStorage.removeItem(TOKEN_KEY); }

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatReceiptDailyUpdatedAt(iso) {
  if (!iso) return '-';
  try {
    return new Date(iso).toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
  } catch {
    return String(iso);
  }
}

function formatYenReceiptInt(n) {
  const x = Number(n);
  if (!Number.isFinite(x)) return '-';
  return '¥' + Math.round(x).toLocaleString('ja-JP');
}

function formatReceiptDailyDateNoYear(raw) {
  const s = String(raw || '').trim();
  if (!s || s === '-') return '-';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (m) return `${Number(m[2])}/${Number(m[3])}`;
  return s;
}

function receiptDailyCellsForDay(r) {
  if (!r) return '<td></td><td></td><td></td><td></td>';
  return (
    `<td>${escapeHtml(formatReceiptDailyDateNoYear(r.date))}</td>` +
    `<td style="text-align:right">${formatYenReceiptInt(r.gross_sales_yen)}</td>` +
    `<td style="text-align:right">${Number(r.party_count || 0)}</td>` +
    `<td style="text-align:right">${Number(r.guest_count || 0)}</td>`
  );
}

function receiptDailyBlockCount() {
  if (typeof window.matchMedia !== 'function') return 2;
  if (window.matchMedia('(min-width: 1024px)').matches) return 4;
  if (window.matchMedia('(min-width: 768px)').matches) return 3;
  return 2;
}

function receiptDailyColspan() {
  return receiptDailyBlockCount() * 4;
}

function receiptDailySyncLayoutChrome(optBlocks) {
  const n = optBlocks != null ? optBlocks : receiptDailyBlockCount();
  const card = dom.receiptDailyTable?.closest('.receipt-daily');
  if (card) {
    card.classList.toggle('receipt-daily--blocks-4', n === 4);
    card.classList.toggle('receipt-daily--blocks-3', n === 3);
    card.classList.toggle('receipt-daily--blocks-2', n === 2);
  }
  const hr = dom.receiptDailyTable?.querySelector('thead tr');
  if (!hr) return;
  const one = '<th>日付</th><th>総売上</th><th>組数</th><th>客数</th>';
  hr.innerHTML = one.repeat(n);
}

function splitReceiptDailySeries(series, numBlocks) {
  const n = series.length;
  const chunks = [];
  let start = 0;
  for (let c = 0; c < numBlocks; c++) {
    const remaining = n - start;
    const slots = numBlocks - c;
    const size = Math.ceil(remaining / slots);
    chunks.push(series.slice(start, start + size));
    start += size;
  }
  return chunks;
}

function receiptDailyOnViewportChange() {
  if (lastReceiptDailyData) {
    renderReceiptDailyTable(lastReceiptDailyData);
    return;
  }
  receiptDailySyncLayoutChrome();
  const td = dom.receiptDailyTableBody?.querySelector('tr:first-child td.empty');
  if (td) td.colSpan = receiptDailyColspan();
}

function renderReceiptDailyTable(data) {
  if (!dom.receiptDailyTableBody || !dom.receiptDailyMeta) return;
  const numBlocks = receiptDailyBlockCount();
  receiptDailySyncLayoutChrome(numBlocks);
  const colspan = numBlocks * 4;
  const month = data?.month ? String(data.month) : '-';
  let storeHead = data?.selected_store_name ? String(data.selected_store_name) : '';
  if (!storeHead && data?.selected_store_key) storeHead = String(data.selected_store_key);
  if (!storeHead) storeHead = '-';
  dom.receiptDailyMeta.textContent =
    `対象: ${storeHead} / ${month} — 更新: ${formatReceiptDailyUpdatedAt(data?.generated_at)}`;
  const series = Array.isArray(data?.series) ? data.series : [];
  const tb = dom.receiptDailyTableBody;
  tb.innerHTML = '';
  if (series.length === 0) {
    const trE = document.createElement('tr');
    trE.innerHTML = `<td class="empty" colspan="${colspan}">データがありません。</td>`;
    tb.appendChild(trE);
    return;
  }
  const chunks = splitReceiptDailySeries(series, numBlocks);
  let nRows = 0;
  for (let ci = 0; ci < chunks.length; ci++) {
    if (chunks[ci].length > nRows) nRows = chunks[ci].length;
  }
  for (let ri = 0; ri < nRows; ri++) {
    const tr = document.createElement('tr');
    for (let bi = 0; bi < numBlocks; bi++) {
      const row = chunks[bi][ri];
      if (row && Number(row.receipt_count || 0) === 0) {
        tr.classList.add(`receipt-daily-block${bi}-empty`);
      }
    }
    let rowHtml = '';
    for (let bi = 0; bi < numBlocks; bi++) {
      rowHtml += receiptDailyCellsForDay(chunks[bi][ri]);
    }
    tr.innerHTML = rowHtml;
    tb.appendChild(tr);
  }
  const t = data?.totals ?? {};
  const trSum = document.createElement('tr');
  trSum.style.fontWeight = 'bold';
  trSum.style.borderTop = '2px solid rgba(128, 160, 188, 0.45)';
  trSum.innerHTML =
    '<td>月間合計</td>' +
    `<td style="text-align:right">${formatYenReceiptInt(t.total_gross_sales_yen)}</td>` +
    `<td style="text-align:right">${Number(t.total_party_count || 0)}</td>` +
    `<td style="text-align:right">${Number(t.total_guest_count || 0)}</td>` +
    `<td colspan="${4 * (numBlocks - 1)}"></td>`;
  tb.appendChild(trSum);
}

function buildReceiptDailyTablePayload(salesData, displayMonth, isSingleMonth) {
  const storeName = salesData?.selected_store_name ?? '';
  const storeKey = salesData?.selected_store_key ?? '';
  if (isSingleMonth) {
    return {
      month: salesData?.month ?? displayMonth,
      series: salesData?.series ?? [],
      totals: salesData?.totals ?? {},
      generated_at: salesData?.generated_at,
      selected_store_name: storeName,
      selected_store_key: storeKey,
    };
  }
  const prefix = `${displayMonth}-`;
  const series = (state.dailySeries ?? []).filter((d) => String(d.date).startsWith(prefix));
  const totals = {
    total_gross_sales_yen: series.reduce((a, r) => a + (Number(r.gross_sales_yen) || 0), 0),
    total_party_count: series.reduce((a, r) => a + (Number(r.party_count) || 0), 0),
    total_guest_count: series.reduce((a, r) => a + (Number(r.guest_count) || 0), 0),
  };
  return {
    month: displayMonth,
    series,
    totals,
    generated_at: salesData?.generated_at,
    selected_store_name: storeName,
    selected_store_key: storeKey,
  };
}

function setBadge(el, cur, prev, label) {
  if (!el) return;
  if (cur == null || prev == null || prev === 0) { el.textContent = ''; el.className = 'kpi-badge flat'; return; }
  const pct = ((cur - prev) / prev) * 100;
  const sign = pct >= 0 ? '+' : '';
  el.textContent = `${label} ${sign}${pct.toFixed(1)}%`;
  el.className = 'kpi-badge ' + (pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat');
}

function applyKpiBadges(displayMonth, monthlySeries) {
  const clearAll = () => {
    ['GrossMom','GrossYoy','PartyMom','PartyYoy','GuestMom','GuestYoy','UnitMom','UnitYoy']
      .forEach(k => { const el = dom['kpiBadge' + k]; if (el) { el.textContent = ''; el.className = 'kpi-badge flat'; } });
  };
  if (!displayMonth || !Array.isArray(monthlySeries) || monthlySeries.length === 0) { clearAll(); return; }
  const byMonth = Object.fromEntries(monthlySeries.map(r => [r.month, r]));
  const cur = byMonth[displayMonth];
  if (!cur) { clearAll(); return; }
  const [y, mo] = displayMonth.split('-').map(Number);
  const prevMo = mo === 1 ? `${y - 1}-12` : `${y}-${String(mo - 1).padStart(2, '0')}`;
  const yoyMo = `${y - 1}-${String(mo).padStart(2, '0')}`;
  const prev = byMonth[prevMo];
  const yoy = byMonth[yoyMo];
  setBadge(dom.kpiBadgeGrossMom,  cur.gross_sales_yen,   prev?.gross_sales_yen,   '前月比');
  setBadge(dom.kpiBadgeGrossYoy,  cur.gross_sales_yen,   yoy?.gross_sales_yen,    '前年比');
  setBadge(dom.kpiBadgePartyMom,  cur.party_count,       prev?.party_count,       '前月比');
  setBadge(dom.kpiBadgePartyYoy,  cur.party_count,       yoy?.party_count,        '前年比');
  setBadge(dom.kpiBadgeGuestMom,  cur.guest_count,       prev?.guest_count,       '前月比');
  setBadge(dom.kpiBadgeGuestYoy,  cur.guest_count,       yoy?.guest_count,        '前年比');
  setBadge(dom.kpiBadgeUnitMom,   cur.avg_unit_price_yen, prev?.avg_unit_price_yen, '前月比');
  setBadge(dom.kpiBadgeUnitYoy,   cur.avg_unit_price_yen, yoy?.avg_unit_price_yen,  '前年比');
}

function currentJstMonth() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit' }).formatToParts(now);
  const y = parts.find(p => p.type === 'year')?.value;
  const m = parts.find(p => p.type === 'month')?.value;
  return `${y}-${m}`;
}

function prevMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  return mo === 1 ? `${y - 1}-12` : `${y}-${String(mo - 1).padStart(2, '0')}`;
}

function periodToMonths(period) {
  const baseMonth = isValidMonthString(state.customMonth) ? state.customMonth : currentJstMonth();
  if (period === 'month') {
    return [baseMonth];
  }
  if (period === 'prev') return [prevMonth(baseMonth)];
  const n = parseInt(period);
  const cur = baseMonth;
  const result = [];
  for (let i = n - 1; i >= 0; i--) {
    let [y, mo] = cur.split('-').map(Number);
    const total = y * 12 + mo - 1 - i;
    result.push(`${Math.floor(total / 12)}-${String((total % 12) + 1).padStart(2, '0')}`);
  }
  return result;
}

function isValidMonthString(value) {
  return /^\d{4}-\d{2}$/.test(String(value ?? ''));
}

function dateRange(months) {
  const sorted = [...months].sort();
  const first = sorted[0];
  const last = sorted[sorted.length - 1];
  const [y, mo] = last.split('-').map(Number);
  const ny = mo === 12 ? y + 1 : y;
  const nm = mo === 12 ? 1 : mo + 1;
  return {
    from: `${first}-01`,
    to: `${String(ny).padStart(4,'0')}-${String(nm).padStart(2,'0')}-01`,
  };
}

function shiftDateString(dateStr, days) {
  const dt = new Date(`${dateStr}T00:00:00Z`);
  if (Number.isNaN(dt.getTime())) return dateStr;
  dt.setUTCDate(dt.getUTCDate() + days);
  return dt.toISOString().slice(0, 10);
}

function diffDateDaysInclusive(from, to) {
  const a = new Date(`${from}T00:00:00Z`).getTime();
  const b = new Date(`${to}T00:00:00Z`).getTime();
  if (!Number.isFinite(a) || !Number.isFinite(b) || b < a) return 0;
  return Math.floor((b - a) / 86400000) + 1;
}

function buildForecastRetryRanges(from, to) {
  if (!from || !to || from > to) return [];
  const maxDays = diffDateDaysInclusive(from, to);
  const candidates = [maxDays, 14, 10, 7, 5, 3, 1]
    .filter((n, i, arr) => n >= 1 && arr.indexOf(n) === i)
    .sort((a, b) => b - a);
  const ranges = [];
  for (const days of candidates) {
    const end = shiftDateString(from, days - 1);
    const clamped = end > to ? to : end;
    if (clamped < from) continue;
    ranges.push({ from, to: clamped });
    if (clamped === to) break;
  }
  return ranges;
}

function dayOfWeek(dateStr) {
  // 0=Sun ... 6=Sat
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
}

async function apiFetch(path) {
  const token = getToken();
  if (!token) throw new Error('トークンが未設定です。');
  const url = PROJECT_URL.replace(/\/+$/, '') + '/functions/v1/admin-api' + path;
  const res = await fetch(url, { headers: { 'x-admin-token': token } });
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`API error ${res.status}: ${text.slice(0, 120)}`);
  }
  return res.json();
}

/* ── weather fetch (Open-Meteo, direct from browser) ── */
async function fetchWeather(storeKey, fromDate, toDate) {
  const coords = STORE_COORDS[storeKey];
  if (!coords) return { map: {}, forecastLimited: false };
  // toDate は表示範囲の翌日（排他）なので末日に補正
  const displayTo = shiftDateString(toDate, -1);
  // 実績は「前日まで」、加えて今日〜10日先の予報を表示
  const todayStr = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  const today = new Date(todayStr);
  const y = new Date(today); y.setDate(y.getDate() - 1);
  const yesterdayStr = y.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  const f = new Date(today); f.setDate(f.getDate() + 10);
  const forecastCapStr = f.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  const forecastToStr = displayTo > forecastCapStr ? forecastCapStr : displayTo;
  const safeFrom = fromDate;
  const safeToHistory = displayTo > yesterdayStr ? yesterdayStr : displayTo;

  // アーカイブAPIは直近3日分を持たないため、
  // それより前は archive、直近数日は forecast を併用して埋める
  const dArchiveEnd = new Date(today); dArchiveEnd.setDate(dArchiveEnd.getDate() - 3);
  const archiveCap = dArchiveEnd.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });

  const result = {};

  // 1) 過去分: archive API （from〜min(safeToHistory, archiveCap)）
  if (safeFrom <= archiveCap && safeToHistory >= safeFrom) {
    const archiveTo = safeToHistory > archiveCap ? archiveCap : safeToHistory;
    const paramsArchive = new URLSearchParams({
      latitude: coords.lat,
      longitude: coords.lon,
      start_date: safeFrom,
      end_date: archiveTo,
      daily: 'temperature_2m_max,precipitation_sum',
      timezone: 'Asia/Tokyo',
    });
    try {
      const res = await fetch(`https://archive-api.open-meteo.com/v1/archive?${paramsArchive}`);
      if (res.ok) {
        const data = await res.json();
        const dates = data?.daily?.time ?? [];
        const temps = data?.daily?.temperature_2m_max ?? [];
        const rains = data?.daily?.precipitation_sum ?? [];
        dates.forEach((dStr, i) => {
          result[dStr] = { temp: temps[i], rain: rains[i] };
        });
      }
    } catch {
      // ignore archive failure
    }
  }

  // 2) 直近分: forecast API （max(archiveCap+1, safeFrom)〜safeTo）
  const dArchiveNext = new Date(dArchiveEnd); dArchiveNext.setDate(dArchiveNext.getDate() + 1);
  const archiveNextStr = dArchiveNext.toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  const forecastHistoryFrom = safeFrom > archiveNextStr ? safeFrom : archiveNextStr;
  if (forecastHistoryFrom <= safeToHistory) {
    const paramsForecast = new URLSearchParams({
      latitude: coords.lat,
      longitude: coords.lon,
      start_date: forecastHistoryFrom,
      end_date: safeToHistory,
      daily: 'temperature_2m_max,precipitation_sum',
      timezone: 'Asia/Tokyo',
    });
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?${paramsForecast}`);
      if (res.ok) {
        const data = await res.json();
        const dates = data?.daily?.time ?? [];
        const temps = data?.daily?.temperature_2m_max ?? [];
        const rains = data?.daily?.precipitation_sum ?? [];
        dates.forEach((dStr, i) => {
          result[dStr] = { temp: temps[i], rain: rains[i] };
        });
      }
    } catch {
      // ignore forecast failure
    }
  }

  // 3) 将来分: 今日〜10日先（表示範囲内）の予報
  const forecastFutureFrom = todayStr > safeFrom ? todayStr : safeFrom;
  if (forecastFutureFrom <= forecastToStr) {
    // end_date が長いと環境によって失敗するため、失敗時は短い期間で段階リトライ
    const futureRanges = buildForecastRetryRanges(forecastFutureFrom, forecastToStr);
    for (const range of futureRanges) {
      const paramsForecastFuture = new URLSearchParams({
        latitude: coords.lat,
        longitude: coords.lon,
        start_date: range.from,
        end_date: range.to,
        daily: 'temperature_2m_max,precipitation_sum',
        timezone: 'Asia/Tokyo',
      });
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?${paramsForecastFuture}`);
        if (!res.ok) continue;
        const data = await res.json();
        const dates = data?.daily?.time ?? [];
        const temps = data?.daily?.temperature_2m_max ?? [];
        const rains = data?.daily?.precipitation_sum ?? [];
        dates.forEach((dStr, i) => {
          result[dStr] = { temp: temps[i], rain: rains[i] };
        });
        if (dates.length > 0) break;
      } catch {
        // try shorter range
      }
    }
  }

  return { map: result, forecastLimited: displayTo > forecastCapStr };
}

/* ── main load ── */
async function loadAll() {
  const token = getToken();
  if (!token) {
    dom.filterMeta.textContent = 'トークンを保存してください。';
    resetReceiptDailyDisconnected();
    return;
  }

  const months = periodToMonths(state.period);
  const { from, to } = dateRange(months);
  const isSingleMonth = months.length === 1;
  const displayMonth = months[months.length - 1];
  const sortedMonths = [...months].sort();

  dom.filterMeta.textContent = '読み込み中…';
  dom.loadingDaily.classList.add('show');
  dom.loadingMonthly.classList.add('show');

  try {
    const fetchSalesMonth = (m, storeKey) =>
      apiFetch(`/receipts/sales?month=${encodeURIComponent(m)}&store_key=${encodeURIComponent(storeKey ?? '')}`);
    const fetchMonthly = (storeKey) =>
      apiFetch(`/analytics/monthly?months=14&store_key=${encodeURIComponent(storeKey ?? '')}`).catch(() => null);

    let salesData;
    let dailySeries;
    /** 売上・月次と並行で開始し、UI は先に描画してから await する（体感の待ち時間を短くする） */
    let weatherPromise;

    if (state.storeKey) {
      const sk = state.storeKey;
      weatherPromise = fetchWeather(sk, from, to);
      dom.weatherStatus.textContent = '天候取得中…';
      const [salesResults, monthlyData] = await Promise.all([
        Promise.all(sortedMonths.map((m) => fetchSalesMonth(m, sk).catch(() => null))),
        fetchMonthly(sk),
      ]);
      const byMonth = new Map(
        (salesResults.filter(Boolean)).map((r) => [r.month, r]),
      );
      salesData = byMonth.get(displayMonth) ?? salesResults.filter(Boolean).slice(-1)[0];
      if (!salesData) throw new Error('売上データを取得できませんでした。');
      dailySeries = sortedMonths.flatMap((m) => byMonth.get(m)?.series ?? []);

      state.monthlySeries = monthlyData?.series ?? [];
    } else {
      const primary = await fetchSalesMonth(displayMonth, '');
      salesData = primary;
      if (salesData.store_options?.length) {
        updateStoreSelect(salesData.store_options, salesData.selected_store_key);
      }
      if (!state.storeKey && salesData.selected_store_key) {
        state.storeKey = salesData.selected_store_key;
      }
      const sk = state.storeKey || '';
      const otherMonths = sortedMonths.filter((m) => m !== displayMonth);

      weatherPromise = fetchWeather(sk, from, to);
      dom.weatherStatus.textContent = '天候取得中…';
      const parallel = [fetchMonthly(sk)];
      if (otherMonths.length > 0) {
        parallel.push(
          Promise.all(otherMonths.map((m) => fetchSalesMonth(m, sk).catch(() => null))),
        );
      }
      const wave = await Promise.all(parallel);
      const monthlyData = wave[0];
      const extraResults = otherMonths.length > 0 ? wave[1] : [];

      state.monthlySeries = monthlyData?.series ?? [];

      const extraByMonth = new Map(
        (Array.isArray(extraResults) ? extraResults : []).filter(Boolean).map((r) => [r.month, r]),
      );
      dailySeries = sortedMonths.flatMap((m) => {
        if (m === displayMonth) return salesData.series ?? [];
        return extraByMonth.get(m)?.series ?? [];
      });
    }

    state.dailySeries = dailySeries;

    if (state.storeKey && salesData.store_options?.length) {
      updateStoreSelect(salesData.store_options, salesData.selected_store_key);
    }

    state.weather = {};
    const addr = STORE_ADDRESS[state.storeKey];
    dom.weatherAddress.textContent = addr ? `📍 ${addr}` : '';

    // KPI（天候より先に表示）
    const totals = salesData.totals;
    dom.kpiPeriodLabel.textContent = isSingleMonth ? `（${displayMonth}）` : `（${months[0]}〜${displayMonth}）`;
    dom.kpiGross.textContent = yen(totals?.total_gross_sales_yen);
    dom.kpiParty.textContent = num(totals?.total_party_count) + ' 組';
    dom.kpiPartyAvg.textContent = totals?.avg_party_count ? `1日平均 ${totals.avg_party_count} 組` : '';
    dom.kpiGuest.textContent = num(totals?.total_guest_count) + ' 名';
    dom.kpiGuestAvg.textContent = totals?.avg_guest_count ? `1日平均 ${totals.avg_guest_count} 名` : '';
    dom.kpiUnit.textContent = yen(totals?.avg_unit_price_yen);
    const activeDays = dailySeries.filter(d => d.receipt_count > 0).length;
    dom.kpiDays.textContent = activeDays + ' 日';
    dom.kpiReceipts.textContent = totals?.receipt_count ? `レシート ${totals.receipt_count} 件` : '';

    if (isSingleMonth) applyKpiBadges(displayMonth, state.monthlySeries);
    else applyKpiBadges(null, state.monthlySeries);

    dom.filterMeta.textContent = `対象: ${salesData.selected_store_name ?? '-'} / ${months.length === 1 ? displayMonth : months[0] + '〜' + displayMonth} / レシート ${totals?.receipt_count ?? 0}件`;
    dom.lastRefresh.textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');

    renderAllCharts();

    lastReceiptDailyData = buildReceiptDailyTablePayload(salesData, displayMonth, isSingleMonth);
    renderReceiptDailyTable(lastReceiptDailyData);

    dom.loadingDaily.classList.remove('show');
    dom.loadingMonthly.classList.remove('show');

    const weatherResult = await (weatherPromise ?? Promise.resolve({ map: {} })).catch(() => ({ map: {} }));
    state.weather = weatherResult?.map ?? {};
    const weatherCount = Object.keys(state.weather).length;
    dom.weatherStatus.textContent = weatherCount > 0
      ? `天候データ ${weatherCount}日分（実績+予報10日）`
      : '天候データなし';

    renderAllCharts();
  } catch (e) {
    dom.filterMeta.textContent = 'エラー: ' + e.message;
    lastReceiptDailyData = null;
    if (dom.receiptDailyMeta) dom.receiptDailyMeta.textContent = '取得失敗: ' + e.message;
    receiptDailySyncLayoutChrome();
    if (dom.receiptDailyTableBody) {
      dom.receiptDailyTableBody.innerHTML =
        `<tr><td class="empty" colspan="${receiptDailyColspan()}">取得に失敗しました</td></tr>`;
    }
  } finally {
    dom.loadingDaily.classList.remove('show');
    dom.loadingMonthly.classList.remove('show');
  }
}

function updateStoreSelect(options, selectedKey) {
  const prev = dom.storeSelect.value || state.storeKey;
  dom.storeSelect.innerHTML = '';

  // APIから返ってきた店舗（レシートあり）
  const apiKeys = new Set(options.map(o => o.store_key));
  for (const opt of options) {
    const el = document.createElement('option');
    el.value = opt.store_key;
    el.textContent = opt.store_name;
    dom.storeSelect.appendChild(el);
  }

  // 座標登録済みでAPIに未登場の店舗（レシートなし）
  for (const key of Object.keys(STORE_COORDS)) {
    if (apiKeys.has(key)) continue;
    const el = document.createElement('option');
    el.value = key;
    el.textContent = (STORE_NAMES[key] ?? key) + '　（データなし）';
    dom.storeSelect.appendChild(el);
  }

  const allKeys = [...apiKeys, ...Object.keys(STORE_COORDS)];
  if (prev && allKeys.includes(prev)) dom.storeSelect.value = prev;
  state.storeOptions = options;
}

function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); delete state.charts[key]; }
}

function cssVar(name) {
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}

/* ── 天気アイコン変換 ── */
function weatherIcon(rain, temp) {
  if (rain == null && temp == null) return '';
  if (rain != null && rain > 10) return '🌧';
  if (rain != null && rain > 0.5) return '🌦';
  if (temp != null && temp >= 30) return '🌡';
  if (temp != null && temp >= 23) return '☀️';
  if (temp != null && temp >= 15) return '🌤';
  if (temp != null && temp >= 5)  return '⛅';
  if (temp != null && temp < 5)   return '❄️';
  return '';
}

/* ── Chart 1: daily sales + weather ── */
function renderDailyChart() {
  destroyChart('daily');
  const series = state.dailySeries;
  if (!series.length) return;
  const { gridColor, tickColor, legendColor } = chartDefaults();
  const todayStr = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
  const salesMap = {};
  series.forEach((d) => { salesMap[d.date] = d; });
  const chartDates = buildDailyChartDates(series, state.weather);
  const labels = chartDates.map(d => d.slice(5)); // MM-DD
  const gross = chartDates.map(d => salesMap[d]?.gross_sales_yen ?? null);
  const rain = chartDates.map(d => state.weather[d]?.rain ?? null);
  const temp = chartDates.map(d => state.weather[d]?.temp ?? null);

  const datasets = [
    {
      type: 'bar', label: '降水量(mm)', data: rain, yAxisID: 'yRain',
      backgroundColor: 'rgba(122,180,255,0.62)', borderColor: 'rgba(122,180,255,0.95)',
      borderWidth: 1, order: 3,
    },
    {
      type: 'line', label: '総売上', data: gross, yAxisID: 'ySales',
      borderColor: cssVar('--c-gross'), backgroundColor: 'rgba(89,220,255,0.1)',
      tension: 0.3, pointRadius: 3, fill: true, order: 1,
    },
    {
      type: 'line', label: '最高気温(℃)', data: temp, yAxisID: 'yTemp',
      borderColor: cssVar('--c-temp'), backgroundColor: 'transparent',
      tension: 0.4, pointRadius: 2, borderDash: [2, 4], order: 2,
    },
  ];

  // 祝日バンドを描くプラグイン
  const holidayPlugin = {
    id: 'holidayBands',
    afterDraw(chart) {
      const { ctx, chartArea } = chart;
      if (!chartArea) return;
      // 総売上ライン（dataset index 1）の要素座標を使う（常にデータあり）
      const meta = chart.getDatasetMeta(1);
      if (!meta?.data?.length) return;
      ctx.save();
      const barW = chartArea.width / Math.max(chartDates.length, 1);
      chartDates.forEach((dateStr, i) => {
        const x = meta.data[i]?.x;
        if (x == null) return;
        const dow = new Date(dateStr).getDay(); // 0=日, 6=土
        const isHoliday = JAPANESE_HOLIDAYS.has(dateStr);
        const isSat = dow === 6;
        const isSun = dow === 0;
        if (!isHoliday && !isSat && !isSun) return;

        // 背景バンド（祝日 > 日曜 > 土曜の優先順で色を決定）
        if (isHoliday) {
          ctx.fillStyle = 'rgba(255,90,90,0.12)';
        } else if (isSun) {
          ctx.fillStyle = 'rgba(255,110,110,0.08)';
        } else {
          ctx.fillStyle = 'rgba(100,160,255,0.08)';
        }
        ctx.fillRect(x - barW / 2, chartArea.top, barW, chartArea.bottom - chartArea.top);

        // ラベル（祝日優先、次に曜日）
        const label = isHoliday ? '祝' : isSun ? '日' : '土';
        const color = (isHoliday || isSun) ? 'rgba(255,90,90,0.9)' : 'rgba(100,160,255,0.9)';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(label, x, chartArea.top + 2);
      });
      ctx.restore();
    },
  };

  // 天気アイコンをx軸ラベルの上に描くプラグイン
  const weatherIconPlugin = {
    id: 'weatherIcons',
    afterDraw(chart) {
      const { ctx, chartArea } = chart;
      if (!chartArea) return;
      const meta = chart.getDatasetMeta(1);
      if (!meta?.data?.length) return;
      ctx.save();
      ctx.font = '13px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      chartDates.forEach((dateStr, i) => {
        const w = state.weather[dateStr];
        const icon = weatherIcon(w?.rain ?? null, w?.temp ?? null);
        if (!icon) return;
        const x = meta.data[i]?.x;
        if (x == null) return;
        const y = chart.scales.x.bottom + 2;
        ctx.textBaseline = 'top';
        ctx.fillText(icon, x, y);
      });
      ctx.restore();
    },
  };

  state.charts.daily = new Chart($('chartDaily').getContext('2d'), {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      layout: { padding: { bottom: 26 } },
      plugins: {
        legend: { labels: { color: legendColor, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            title: (items) => {
              const idx = items[0]?.dataIndex;
              const dateStr = chartDates[idx];
              const holidayName = dateStr ? JAPANESE_HOLIDAYS.get(dateStr) : null;
              const label = items[0]?.label ?? '';
              return holidayName ? `${label}（${holidayName}）` : label;
            },
            label: (ctx) => {
              const v = ctx.raw;
              if (v == null) return null;
              if (ctx.dataset.yAxisID === 'ySales') return ` ${ctx.dataset.label}: ¥${Number(v).toLocaleString()}`;
              if (ctx.dataset.yAxisID === 'yTemp') return ` 最高気温: ${v}℃`;
              if (ctx.dataset.yAxisID === 'yRain') return ` 降水量: ${v}mm`;
              return ` ${ctx.dataset.label}: ${v}`;
            },
          },
        },
      },
      scales: {
        x: { ticks: { color: tickColor, font: { size: 10 }, maxRotation: 45, padding: 2 }, grid: { color: gridColor } },
        ySales: {
          type: 'linear', position: 'left', ticks: { color: tickColor, font: { size: 10 }, callback: v => '¥' + (v/10000).toFixed(0) + '万' },
          grid: { color: gridColor },
        },
        yRain: {
          type: 'linear', position: 'right', min: 0,
          ticks: { color: cssVar('--c-rain'), font: { size: 10 }, callback: v => v + 'mm' },
          grid: { display: false },
        },
        yTemp: {
          type: 'linear', position: 'right', display: false,
        },
      },
    },
    plugins: [holidayPlugin, weatherIconPlugin],
  });
}

function buildDailyChartDates(series, weatherMap) {
  const dates = [];
  const seen = new Set();
  const salesDates = series.map(d => d.date).sort();
  for (const d of salesDates) {
    if (!seen.has(d)) { seen.add(d); dates.push(d); }
  }

  const keys = Object.keys(weatherMap || {});
  if (salesDates.length === 0) return keys.sort();
  const lastSalesDate = salesDates[salesDates.length - 1];
  for (const d of keys.sort()) {
    if (d > lastSalesDate && !seen.has(d)) {
      seen.add(d);
      dates.push(d);
    }
  }
  return dates;
}

/* ── Chart 2: weekday avg ── */
function renderWeekdayChart() {
  destroyChart('weekday');
  const series = state.dailySeries.filter(d => d.receipt_count > 0);
  if (!series.length) return;
  const { gridColor, tickColor, legendColor } = chartDefaults();
  const DOW = ['日', '月', '火', '水', '木', '金', '土'];
  const buckets = Array.from({ length: 7 }, () => ({ sum: 0, count: 0 }));
  for (const d of series) {
    const dow = dayOfWeek(d.date);
    const metric = state.weekdayMetric === 'gross' ? d.gross_sales_yen
      : state.weekdayMetric === 'guest' ? d.guest_count : d.party_count;
    buckets[dow].sum += metric;
    buckets[dow].count += 1;
  }
  const avgs = buckets.map(b => b.count > 0 ? Math.round(b.sum / b.count) : 0);
  const maxAvg = Math.max(...avgs);
  const bgColors = DOW.map((_, i) => {
    if (i === 0 || i === 6) return 'rgba(255,156,159,0.7)'; // 休日
    return 'rgba(89,220,255,0.55)';
  });

  const labelMap = { gross: '平均総売上', guest: '平均客数', party: '平均組数' };
  const valueLabel = state.weekdayMetric === 'gross'
    ? v => '¥' + Number(v).toLocaleString()
    : v => v + (state.weekdayMetric === 'guest' ? '名' : '組');

  state.charts.weekday = new Chart($('chartWeekday').getContext('2d'), {
    type: 'bar',
    data: {
      labels: DOW,
      datasets: [{
        label: labelMap[state.weekdayMetric], data: avgs,
        backgroundColor: bgColors, borderRadius: 6, borderSkipped: false,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ' ' + valueLabel(ctx.raw) } },
      },
      scales: {
        x: { ticks: { color: tickColor, font: { size: 12 } }, grid: { color: gridColor } },
        y: { ticks: { color: tickColor, font: { size: 10 }, callback: valueLabel }, grid: { color: gridColor }, beginAtZero: true },
      },
    },
  });
}

/* ── Chart 6: weekday × weather cross table ── */
function weatherCategory(rain) {
  if (rain == null) return null;
  if (rain < 1)  return '晴れ';
  if (rain < 5)  return '小雨';
  if (rain < 20) return '雨';
  return '大雨';
}

function renderWeatherCrossTable() {
  const container = document.getElementById('weatherCrossTable');
  if (!container) return;

  const series = state.dailySeries.filter(d => d.receipt_count > 0);
  if (!series.length) { container.innerHTML = '<p style="color:var(--sub);font-size:0.85rem;padding:12px">データなし</p>'; return; }

  const DAYS = ['月', '火', '水', '木', '金', '土', '日'];
  const CATS = ['晴れ', '小雨', '雨', '大雨'];
  const CAT_ICON = { '晴れ': '☀️', '小雨': '🌦', '雨': '🌧', '大雨': '⛈' };

  // acc[day][cat] = { sum, count }
  const acc = {};
  DAYS.forEach(d => { acc[d] = {}; CATS.forEach(c => { acc[d][c] = { sum: 0, n: 0 }; }); acc[d]['_all'] = { sum: 0, n: 0 }; });
  const catAcc = {}; CATS.forEach(c => { catAcc[c] = { sum: 0, n: 0 }; }); catAcc['_all'] = { sum: 0, n: 0 };

  for (const row of series) {
    const date = new Date(row.date + 'T00:00:00+09:00');
    const dow = DAYS[(date.getDay() + 6) % 7]; // 0=Mon
    const w = state.weather[row.date];
    const cat = w ? weatherCategory(w.rain) : null;
    const g = row.gross_sales_yen;
    acc[dow]['_all'].sum += g; acc[dow]['_all'].n++;
    catAcc['_all'].sum += g; catAcc['_all'].n++;
    if (cat) {
      acc[dow][cat].sum += g; acc[dow][cat].n++;
      catAcc[cat].sum += g; catAcc[cat].n++;
    }
  }

  const avg = (b) => b.n ? Math.round(b.sum / b.n) : null;

  // Collect all non-null values for heatmap scale
  const allVals = [];
  DAYS.forEach(d => CATS.forEach(c => { const v = avg(acc[d][c]); if (v) allVals.push(v); }));
  const maxVal = allVals.length ? Math.max(...allVals) : 1;
  const minVal = allVals.length ? Math.min(...allVals) : 0;

  function cellClass(v) {
    if (v == null) return 'empty';
    const ratio = maxVal === minVal ? 0.5 : (v - minVal) / (maxVal - minVal);
    if (ratio >= 0.7) return 'hot';
    if (ratio <= 0.3) return 'cold';
    return '';
  }

  const fmt = v => v == null ? '-' : '¥' + v.toLocaleString('ja-JP');

  let html = '<table class="cross-table"><thead><tr><th>曜日</th>';
  CATS.forEach(c => { html += `<th>${CAT_ICON[c]} ${c}</th>`; });
  html += '<th>全天候平均</th><th>日数</th></tr></thead><tbody>';

  DAYS.forEach(d => {
    html += `<tr><th>${d}</th>`;
    CATS.forEach(c => {
      const v = avg(acc[d][c]);
      const cls = cellClass(v);
      html += `<td class="${cls}">${fmt(v)}${acc[d][c].n ? `<br><span style="font-size:0.68rem;opacity:0.6">${acc[d][c].n}日</span>` : ''}</td>`;
    });
    const allV = avg(acc[d]['_all']);
    html += `<td style="font-weight:700;color:var(--accent)">${fmt(allV)}</td><td style="color:var(--sub)">${acc[d]['_all'].n}</td></tr>`;
  });

  html += '</tbody><tfoot><tr><th>天候平均</th>';
  CATS.forEach(c => {
    const v = avg(catAcc[c]);
    html += `<td>${fmt(v)}${catAcc[c].n ? `<br><span style="font-size:0.68rem;opacity:0.6">${catAcc[c].n}日</span>` : ''}</td>`;
  });
  const grandAvg = avg(catAcc['_all']);
  html += `<td style="font-weight:700;color:var(--accent)">${fmt(grandAvg)}</td><td style="color:var(--sub)">${catAcc['_all'].n}</td></tr></tfoot></table>`;

  container.innerHTML = html;
}
